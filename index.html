<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>台股機構投資人買賣分析系統</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            position: relative;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #e8f4f8 0%, #f5f7fa 100%);
            padding: 10px;
            min-height: 100vh;
            width: 100%;
            position: relative;
        }

        @media (min-width: 768px) {
            body {
                padding: 20px;
            }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            min-width: 0;
        }

        .header {
            background: white;
            padding: 15px 15px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            margin-bottom: 10px;
            position: relative;
        }

        @media (min-width: 768px) {
            .header {
                padding: 25px 30px;
                border-radius: 20px;
                margin-bottom: 20px;
            }
        }

        .version {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 0.75em;
            color: #95a5a6;
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .version {
                top: 20px;
                right: 25px;
                font-size: 0.85em;
            }
        }

        .market-selector {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }

        @media (min-width: 768px) {
            .market-selector {
                gap: 10px;
                margin-bottom: 12px;
            }
        }

        .market-btn {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #495057;
            border: 2px solid transparent;
            padding: 8px 16px;
            border-radius: 980px;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (min-width: 768px) {
            .market-btn {
                padding: 10px 24px;
                font-size: 0.95em;
            }
        }

        .market-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.35);
        }

        .market-btn:hover:not(.active) {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            transform: translateY(-2px);
            border: 2px solid #667eea;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.4em;
            margin-bottom: 6px;
            text-align: center;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 2.2em;
                margin-bottom: 8px;
            }
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.85em;
            margin-bottom: 12px;
            font-weight: 400;
        }

        @media (min-width: 768px) {
            .subtitle {
                font-size: 1em;
                margin-bottom: 16px;
            }
        }

        .category-tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 0;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .category-tabs {
                gap: 12px;
                margin-bottom: 0;
            }
        }

        .category-tab {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: #495057;
            border: none;
            padding: 10px 20px;
            border-radius: 980px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        @media (min-width: 768px) {
            .category-tab {
                padding: 12px 32px;
                font-size: 1em;
            }
        }

        .category-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.35);
        }

        .category-tab:hover:not(.active) {
            background: linear-gradient(135deg, #e9ecef 0%, #dee2e6 100%);
            transform: translateY(-2px);
            border: 2px solid #667eea;
        }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            margin-bottom: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
        }

        @media (min-width: 768px) {
            .controls {
                padding: 24px;
                border-radius: 20px;
                margin-bottom: 20px;
                gap: 16px;
            }
        }

        .sort-group {
            display: flex;
            gap: 8px;
            align-items: center;
            flex: 1;
            min-width: 200px;
        }

        @media (min-width: 768px) {
            .sort-group {
                gap: 12px;
            }
        }

        .sort-label {
            color: #7f8c8d;
            font-size: 0.85em;
            font-weight: 500;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .sort-label {
                font-size: 0.95em;
            }
        }

        .sort-select {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 0.9em;
            background: white;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        @media (min-width: 768px) {
            .sort-select {
                padding: 12px 16px;
                border-radius: 14px;
                font-size: 1em;
            }
        }

        .sort-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .sort-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.9em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.25);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            .sort-toggle {
                padding: 12px 20px;
                border-radius: 14px;
                font-size: 1em;
                gap: 8px;
            }
        }

        .sort-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.35);
        }

        .sort-toggle:active {
            transform: translateY(0);
        }

        .table-container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            overflow-x: auto;
            overflow-y: hidden;
            margin-bottom: 30px;
            -webkit-overflow-scrolling: touch;
            max-width: 100%;
            touch-action: auto;
        }

        .table-scroll-hint {
            display: none;
        }

        .table-container:focus-visible {
            outline: 3px solid #667eea;
            outline-offset: 3px;
        }

        @media (min-width: 768px) {
            .table-container {
                border-radius: 20px;
                margin-bottom: 40px;
            }
        }

        table {
            width: 100%;
            min-width: 650px;
            border-collapse: collapse;
            display: table;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .col-rank {
            width: 55px;
            min-width: 55px;
            text-align: center;
            line-height: 1.2;
        }

        @media (max-width: 767px) {
            th.col-rank,
            td.col-rank {
                position: sticky;
                left: 0;
                z-index: 3;
            }
            
            thead th.col-rank {
                z-index: 12;
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
            
            tbody td.col-rank {
                background: white;
            }
            
            tbody tr:hover td.col-rank {
                background: #f8f9ff;
            }
            
            td.col-rank::after {
                content: '';
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                width: 3px;
                background: linear-gradient(90deg, rgba(0,0,0,0.06), transparent);
                pointer-events: none;
            }
        }

        .rank-num {
            font-weight: 700;
            font-size: 1em;
            color: #2c3e50;
        }

        .rank-1 .rank-num { color: #e74c3c; }
        .rank-2 .rank-num { color: #e67e22; }
        .rank-3 .rank-num { color: #f1c40f; }

        .rank-code {
            font-size: 0.7em;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        .col-stock {
            width: 110px;
            min-width: 110px;
            text-align: left;
            padding-left: 8px !important;
        }

        th.col-stock {
            color: white;
        }

        .stock-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9em;
            line-height: 1.3;
            word-wrap: break-word;
        }

        .stock-code {
            font-size: 0.7em;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-top: 2px;
        }

        .mobile-only {
            display: block;
        }
        .desktop-only {
            display: none;
        }

        @media (min-width: 768px) {
            .mobile-only {
                display: none;
            }
            .desktop-only {
                display: block;
            }
        }

        th {
            padding: 14px 6px;
            text-align: center;
            font-weight: 600;
            font-size: 0.8em;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        @media (min-width: 768px) {
            th {
                padding: 18px 12px;
                font-size: 0.95em;
            }
        }

        td {
            padding: 10px 4px;
            text-align: center;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.85em;
            transition: background 0.2s;
        }

        @media (min-width: 768px) {
            td {
                padding: 16px 12px;
                font-size: 0.95em;
            }
        }

        tbody tr:hover {
            background: linear-gradient(90deg, rgba(102, 126, 234, 0.03) 0%, rgba(118, 75, 162, 0.03) 100%);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .rank {
            font-weight: 600;
            color: #95a5a6;
            font-size: 0.9em;
        }

        .rank-1 {
            font-weight: 700;
            color: #f39c12;
            font-size: 1.1em;
        }

        .rank-2 {
            font-weight: 700;
            color: #95a5a6;
            font-size: 1.05em;
        }

        .rank-3 {
            font-weight: 700;
            color: #cd7f32;
            font-size: 1em;
        }

        .price-up {
            color: #e74c3c;
            font-weight: 600;
        }

        .price-down {
            color: #27ae60;
            font-weight: 600;
        }

        .price-neutral {
            color: #95a5a6;
        }

        .volume-cell {
            padding: 0 !important;
            position: relative;
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 8px 12px;
            position: relative;
            min-height: 45px;
        }

        .volume-text {
            position: relative;
            z-index: 2;
        }

        .vol-bars-container {
            position: absolute;
            top: 4px;
            bottom: 4px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1px;
        }

        .bid-bars {
            right: 0;
            left: 0;
        }

        .ask-bars {
            left: 0;
            right: 0;
        }

        .vol-bar {
            height: 5px;
            border-radius: 2px;
            min-width: 2px;
        }

        .bid-bar {
            margin-left: auto;
        }

        .ask-bar {
            margin-right: auto;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            font-size: 1.1em;
        }

        @media (max-width: 767px) {
            table {
                font-size: 0.85em;
            }
            
            th, td {
                padding: 10px 4px;
            }
            
            .stock-name {
                max-width: 95px;
                line-height: 1.2;
                word-wrap: break-word;
            }
        }

        .message-box {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            z-index: 1000;
            font-weight: 500;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media (max-width: 767px) {
            .message-box {
                top: 10px;
                right: 10px;
                left: 10px;
                padding: 12px 16px;
                font-size: 0.9em;
            }
        }

        .iframe-container {
            background: white;
            border-radius: 16px;
            position: relative;
            width: 100%;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
        }

        .iframe-container iframe {
            display: block;
            width: 100%;
            height: calc(100vh - 280px);
            min-height: 500px;
            border: none;
            border-radius: 16px;
        }

        .stock-panel {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08);
            min-width: 0;
        }

        .stock-list-header, .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        #stockSearch {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            width: 300px;
            max-width: 100%;
            min-width: 0;
            font-size: 1em;
        }

        .chart-stock-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        #stockSelector {
            padding: 10px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            min-width: 0;
            max-width: 100%;
            cursor: pointer;
        }

        .stock-nav-button {
            padding: 10px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: 500;
            flex-shrink: 0;
        }

        #stockChartContent, #stockAnalysisCard {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        #plotlyChart {
            width: 100%;
            height: 800px;
        }

        @media (max-width: 767px) {
            body {
                padding: 8px;
                padding-bottom: max(16px, env(safe-area-inset-bottom));
                padding-left: max(8px, env(safe-area-inset-left));
                padding-right: max(8px, env(safe-area-inset-right));
            }

            .header {
                padding: 12px;
            }

            .version {
                position: static;
                text-align: right;
                margin-bottom: 4px;
            }

            h1 {
                font-size: 1.25em;
                line-height: 1.4;
            }

            .market-selector {
                flex-wrap: wrap;
            }

            .market-btn, .category-tab {
                min-height: 44px;
            }

            .category-tabs {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }

            .category-tab {
                padding: 8px 6px;
                border-radius: 12px;
                font-size: 0.85em;
                line-height: 1.4;
                overflow-wrap: anywhere;
            }

            .controls {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                padding: 12px;
            }

            .sort-group {
                min-width: 0;
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
            }

            .sort-select {
                width: 100%;
                font-size: 16px;
                min-height: 44px;
            }

            .sort-toggle {
                align-self: end;
                min-height: 44px;
                padding: 10px 12px;
            }

            .table-scroll-hint {
                display: block;
                padding: 10px 12px;
                color: #596a7a;
                font-size: 0.8em;
                background: #f8f9ff;
                border-radius: 12px;
                margin-bottom: 8px;
            }

            .iframe-container {
                border-radius: 12px;
                margin: 0;
                width: 100%;
            }

            .iframe-container iframe {
                border-radius: 12px;
                min-height: 0;
                width: 100%;
            }

            .stock-panel {
                padding: 12px;
            }

            .stock-list-header {
                align-items: stretch;
                flex-direction: column;
            }

            #stockSearch {
                width: 100%;
                min-height: 44px;
                font-size: 16px;
            }

            #stockListContent {
                max-height: none !important;
                overflow: visible !important;
            }

            .chart-toolbar {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .chart-stock-picker {
                grid-column: 1 / -1;
                grid-row: 1;
                justify-content: flex-start;
            }

            #stockSelector {
                width: 100%;
                min-height: 44px;
                font-size: 16px;
            }

            .chart-stock-picker label {
                min-height: 44px;
            }

            .stock-nav-button {
                width: 100%;
                min-height: 44px;
                padding: 10px 12px;
                font-size: 1em;
            }

            #plotlyChart {
                height: 1000px;
            }

            .loading {
                width: min(280px, calc(100% - 32px));
                padding: 24px;
            }
        }

        .stock-item:hover {
            background: #e9ecef !important;
            border-color: #667eea !important;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="version">v3.0</div>
            <h1>台股機構投資人買賣分析</h1>
            <div class="subtitle">每日收盤資料・法人分析・量價選股</div>
            
            <div class="market-selector">
                <button class="market-btn active" id="btnTSE" onclick="switchMarket('TSE')">上市</button>
                <button class="market-btn" id="btnOTC" onclick="switchMarket('OTC')">上櫃</button>
                <button class="market-btn" id="btnWATCHLIST" onclick="switchMarket('WATCHLIST')">追蹤股</button>
            </div>
            
            <p style="text-align:center; margin: 12px 0;"><a href="trends/index.html">量價選股圖表</a> · <a href="StockInfo/tse_analysis_result.xlsx">上市 Excel</a> · <a href="StockInfo/otc_analysis_result.xlsx">上櫃 Excel</a></p>
            <div class="info-bar" style="display: flex; justify-content: center; align-items: center; margin-bottom: 12px; font-size: 0.9em;">
                <div class="info-item" style="display: flex; align-items: center; gap: 4px;">
                    <span class="info-icon">🕐</span>
                    <span class="info-text" id="updateTime">--:--:--</span>
                </div>
            </div>
            
            <div class="category-tabs" id="stockCategoryTabs">
                <button class="category-tab active" id="tabFiveDay" onclick="switchCategory('fiveday')">
                    過去五日買賣超
                </button>
                <button class="category-tab" id="tabSixtyDay" onclick="switchCategory('sixtyDay')">
                    歷史走勢
                </button>
                <button class="category-tab" id="tabBreakout" onclick="switchCategory('breakout')">
                    爆量候選
                </button>
            </div>
        </div>

        <div class="iframe-container" id="iframeContainer" style="display: none;">
            <iframe id="externalFrame" title="過去五日法人買賣超報告" scrolling="auto"></iframe>
        </div>

        <div class="stock-panel" id="stockChartContainer" style="display: none;">
            <div id="breakoutSummary" style="display:none; margin-bottom:16px; padding:14px; border-radius:10px; background:#f0f4ff; color:#334563; line-height:1.8;"></div>
            <div class="chart-toolbar">
                <button class="stock-nav-button" id="prevStockBtn">
                    ← 上一筆
                </button>
                
                <div class="chart-stock-picker">
                    <select id="stockSelector" aria-label="選擇股票">
                        <option value="">載入中...</option>
                    </select>
                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; white-space: nowrap;">
                        <input type="checkbox" id="reverseOrderCheckbox" style="cursor: pointer; width: 18px; height: 18px;">
                        <span style="font-size: 0.9em; color: #2c3e50;">反向排序</span>
                    </label>
                </div>
                
                <button class="stock-nav-button" id="nextStockBtn">
                    下一筆 →
                </button>
            </div>
            <div id="breakoutDetails" style="display:none; margin-bottom:12px; line-height:1.8; color:#334563;"></div>
            <div id="stockChartContent"></div>
            
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">資料載入中...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    
    <script>
        const DATA_PATH = './StockInfo/';
        
        let currentMarket = localStorage.getItem('currentMarket') || 'TSE';
        let currentCategory = localStorage.getItem('currentCategory') || 'fiveday';
        if (!['TSE', 'OTC', 'WATCHLIST'].includes(currentMarket)) currentMarket = 'TSE';
        if (!['fiveday', 'sixtyDay', 'breakout'].includes(currentCategory)) currentCategory = 'fiveday';
        let sqlDB = null;
        let hotDatabase = null;
        let hotDBInstance = null;
        let breakoutCandidates = new Map();
        let watchCandidates = new Map();
        let sqlPromise = null;
        let reportResizeObserver = null;
        let currentChartTitle = '';
        let currentChartTicks = { values: [], text: [] };
        let allStocksList = [];
        let currentStockIndex = 0;
        let isReverseOrder = false;
        let manifest = null;
        let viewLoadId = 0;

        function updateDataDate() {
            const key = currentMarket === 'WATCHLIST' ? 'WATCHLIST' : currentMarket;
            const date = (key === 'WATCHLIST' ? manifest?.watchlist?.market_dates?.TSE : manifest?.markets?.[key]?.latest_date) || manifest?.markets?.TSE?.latest_date;
            document.getElementById('updateTime').textContent = date ? `資料日期：${date}` : '資料日期讀取中';
        }

        async function readDatabase(filename) {
            sqlPromise ||= initSqlJs({locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`});
            const SQL = await sqlPromise;
            const response = await fetch(DATA_PATH + filename);
            if (!response.ok) throw new Error(`資料庫載入失敗 (${response.status})`);
            return new SQL.Database(new Uint8Array(await response.arrayBuffer()));
        }

        async function getHotDatabase() {
            hotDatabase ||= readDatabase('stock_breakout_watch.db');
            hotDBInstance = await hotDatabase;
            return hotDBInstance;
        }

        function switchMarket(market) {
            viewLoadId++;
            currentMarket = market;
            updateDataDate();
            resetBreakoutInfo();
            localStorage.setItem('currentMarket', market);
            
            document.getElementById('btnTSE').classList.remove('active');
            document.getElementById('btnOTC').classList.remove('active');
            document.getElementById('btnWATCHLIST').classList.remove('active');
            
            if (market === 'TSE') {
                document.getElementById('btnTSE').classList.add('active');
                document.getElementById('stockCategoryTabs').style.display = '';
                switchCategory(currentCategory);
            } else if (market === 'OTC') {
                document.getElementById('btnOTC').classList.add('active');
                document.getElementById('stockCategoryTabs').style.display = '';
                switchCategory(currentCategory);
            } else if (market === 'WATCHLIST') {
                document.getElementById('btnWATCHLIST').classList.add('active');
                document.getElementById('stockCategoryTabs').style.display = 'none';
                // 直接显示股票图表视图
                showStockChartView();
                loadWatchlistStocks();
            }
        }

        function switchCategory(category) {
            currentCategory = category;
            localStorage.setItem('currentCategory', category);
            
            document.getElementById('tabFiveDay').classList.remove('active');
            document.getElementById('tabSixtyDay').classList.remove('active');
            document.getElementById('tabBreakout').classList.remove('active');
            resetBreakoutInfo();
            
            if (category === 'fiveday') {
                document.getElementById('tabFiveDay').classList.add('active');
                showIframeView();
                loadExternalPage(currentMarket === 'TSE' ? 'tse_analysis_result_complete.html' : 'otc_analysis_result_complete.html');
            } else if (category === 'sixtyDay' || category === 'breakout') {
                document.getElementById(category === 'breakout' ? 'tabBreakout' : 'tabSixtyDay').classList.add('active');
                showStockChartView();
                loadStockList();
            }
        }

        function showIframeView() {
            viewLoadId++;
            document.getElementById('stockChartContainer').style.display = 'none';
            document.getElementById('iframeContainer').style.display = 'block';
        }

        function showStockChartView() {
            document.getElementById('iframeContainer').style.display = 'none';
            document.getElementById('stockChartContainer').style.display = 'block';
        }

        function resizeExternalFrame() {
            const iframe = document.getElementById('externalFrame');
            if (!window.matchMedia('(max-width: 767px)').matches) {
                iframe.style.height = '';
                return;
            }
            try {
                const body = iframe.contentDocument?.body;
                if (body) {
                    // 手機跟隨報告內容高度，讓整頁捲動，也會隨報告分頁更新。
                    const height = Math.ceil(Math.max(body.scrollHeight, body.getBoundingClientRect().height));
                    if (height > 0) iframe.style.height = `${height}px`;
                }
            } catch (error) {
                // 跨來源報告使用 iframe 自身的捲動功能。
            }
        }

        function loadExternalPage(filename) {
            const iframe = document.getElementById('externalFrame');
            reportResizeObserver?.disconnect();
            iframe.style.height = '';
            
            iframe.onload = function() {
                try {
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
                    const style = iframeDoc.createElement('style');
                    style.id = 'reportResponsiveStyles';
                    // 在入口套用樣式，報告資料重新產生後仍保有手機排版。
                    style.textContent = `
                        .table-container {
                            max-width: 100%;
                            overflow-x: auto;
                            touch-action: auto;
                        }
                        @media (max-width: 767px) {
                            html, body { min-height: 0 !important; }
                            body { padding: 6px; font-size: 14px; }
                            .tabs { padding: 8px 8px 0; }
                            .tab-buttons {
                                display: grid;
                                grid-template-columns: repeat(3, minmax(0, 1fr));
                                gap: 6px;
                            }
                            .tab-button {
                                min-height: 44px;
                                padding: 8px 4px;
                                font-size: 13px;
                                border-radius: 8px;
                            }
                            .section { padding: 10px; margin-bottom: 12px; }
                            .section-title {
                                font-size: 16px;
                                line-height: 1.5;
                                overflow-wrap: anywhere;
                            }
                            .table-container::before {
                                content: '↔ 左右滑動表格，查看全部欄位';
                                display: block;
                                position: sticky;
                                left: 0;
                                padding: 8px 0;
                                font-size: 12px;
                                color: #596a7a;
                            }
                            table { min-width: 560px; font-size: 14px; }
                            th, td { padding: 10px 8px; font-size: 14px; }
                            .stock-code, .price-up, .price-down {
                                width: auto;
                                max-width: none;
                                white-space: nowrap;
                            }
                            .stock-code { min-width: 76px; }
                            .stock-name {
                                max-width: none;
                                white-space: normal;
                                overflow: visible;
                                overflow-wrap: anywhere;
                            }
                            .footer { padding: 12px; font-size: 14px; overflow-wrap: anywhere; }
                        }
                    `;
                    iframeDoc.head.appendChild(style);
                    const viewport = iframeDoc.querySelector('meta[name="viewport"]');
                    if (viewport) viewport.content = 'width=device-width, initial-scale=1.0';
                    // 舊版報告在冒泡階段攔截縮放，保留瀏覽器原生雙指手勢。
                    iframeDoc.addEventListener('touchstart', event => {
                        if (event.touches.length > 1) event.stopImmediatePropagation();
                    }, { capture: true, passive: true });
                    iframeDoc.addEventListener('gesturestart', event => {
                        event.stopImmediatePropagation();
                    }, { capture: true, passive: true });
                    iframeDoc.querySelectorAll('.table-container').forEach(table => {
                        table.tabIndex = 0;
                        table.setAttribute('role', 'region');
                        table.setAttribute('aria-label', '法人買賣超表格，可左右捲動');
                    });
                    reportResizeObserver = new ResizeObserver(resizeExternalFrame);
                    reportResizeObserver.observe(iframeDoc.body);
                    resizeExternalFrame();
                } catch(e) {
                    console.log('Cannot inject CSS into iframe (cross-origin)');
                }
            };
            iframe.src = DATA_PATH + filename;
        }

        function resetBreakoutInfo() {
            breakoutCandidates = new Map();
            document.getElementById('breakoutSummary').style.display = 'none';
            document.getElementById('breakoutDetails').style.display = 'none';
        }

        function showBreakoutSummary() {
            const panel = document.getElementById('breakoutSummary');
            const meta = manifest?.breakouts?.[currentMarket];
            panel.style.display = 'block';
            panel.replaceChildren();
            if (!meta) { panel.textContent = '掃描資料讀取中…'; return; }
            const title = document.createElement('strong');
            title.textContent = `${currentMarket === 'TSE' ? '上市' : '上櫃'}爆量候選 ${meta.candidates} 檔 · 資料日期 ${meta.latest_date}`;
            const count = document.createElement('div');
            count.textContent = `掃描 ${meta.scanned_stocks} 檔；${meta.eligible_stocks} 檔具備最近 61 日有效價量。顯示最近 3 個交易日首次出現的訊號。`;
            const details = document.createElement('details');
            const label = document.createElement('summary');
            label.textContent = '查看篩選條件與資料範圍';
            const rules = document.createElement('div');
            const r = meta.rules;
            rules.textContent = `前 ${r.quiet_days} 日均量 ≤ 再往前 ${r.reference_days} 日均量的 ${r.quiet_ratio * 100}%；前 ${r.quiet_days} 日高低價區間 ≤ ${r.max_range * 100}%；訊號日成交量 ≥ ${r.volume_multiple} 倍前期均量、漲幅 ≥ ${r.min_gain * 100}%、收盤突破前期最高價，且收在當日區間上方 ${Math.round((1 - r.min_close_position) * 100)}%。基準均排除訊號當日，前 20 日已有相同訊號者不重複入選。`;
            const scope = document.createElement('div');
            scope.textContent = `${meta.scope}；不受法人前 150 檔與 5,000 張門檻限制。缺漏、停牌或資料不足不以零量補齊。法人缺漏留空，累積值以已取得資料計算。此為價量形態篩選，尚未回測。`;
            details.append(label, rules, scope);
            panel.append(title, count, details);
        }

        function showBreakoutDetails(code) {
            const panel = document.getElementById('breakoutDetails');
            const stock = getStockAtIndex(currentStockIndex);
            const candidate = currentMarket === 'WATCHLIST' ? watchCandidates.get(`${stock?.market}:${code}`) : currentCategory === 'breakout' ? breakoutCandidates.get(code) : null;
            panel.style.display = candidate ? 'block' : 'none';
            if (!candidate) return;
            const pct = value => `${(Number(value) * 100).toFixed(2)}%`;
            panel.textContent = `首次突破 ${candidate.signal_date} ｜ 追蹤第 ${candidate.signal_age} 天 ｜ ${Number(candidate.volume_multiple).toFixed(2)} 倍量 ｜ 當日漲幅 ${pct(candidate.day_gain)} ｜ 入選後漲幅 ${pct(candidate.return_since_signal)} ｜ ${candidate.status}（盤整上緣 ${Number(candidate.base_high).toFixed(2)}；價格日期 ${candidate.latest_price_date}）`;
            panel.style.color = candidate.status === '跌回盤整區' ? '#ae3434' : '#334563';
        }

        async function loadStockList() {
            const chartContent = document.getElementById('stockChartContent');
            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">載入中...</div>';
            const requestId = ++viewLoadId;
            const isBreakout = currentCategory === 'breakout';
            allStocksList = [];
            currentStockIndex = 0;
            updateStockSelector();
            if (isBreakout) showBreakoutSummary();
            
            try {
                const market = currentMarket === 'TSE' ? 'tse' : 'otc';
                const db = await readDatabase(`stock_${market}${isBreakout ? '_breakout' : ''}.db`);
                if (requestId !== viewLoadId) { db.close(); return; }
                if (sqlDB && sqlDB !== hotDBInstance) sqlDB.close();
                sqlDB = db;

                // 保持資料庫原有順序
                const query = isBreakout ? `SELECT code, name FROM candidates ORDER BY signal_date DESC, volume_multiple DESC, code` : `
                    SELECT 股票代碼, 股票名稱
                    FROM stock_data
                    WHERE ROWID IN (
                        SELECT MIN(ROWID) 
                        FROM stock_data 
                        GROUP BY 股票代碼
                    )
                    ORDER BY ROWID
                `;
                const result = sqlDB.exec(query);
                if (isBreakout) {
                    const rows = sqlDB.exec('SELECT * FROM candidates')[0];
                    breakoutCandidates = new Map((rows?.values || []).map(values => {
                        const candidate = Object.fromEntries(rows.columns.map((col, i) => [col, values[i]]));
                        return [candidate.code, candidate];
                    }));
                }
                
                if (result.length === 0 || result[0].values.length === 0) {
                    chartContent.innerHTML = `<div style="text-align: center; padding: 40px; color: #65758a;">${isBreakout ? '最近 3 個交易日沒有符合全部條件的爆量候選。' : '無股票資料'}</div>`;
                    return;
                }
                
                // 儲存股票清單
                allStocksList = result[0].values.map(([code, name]) => ({ code, name }));
                
                // 填充下拉選單
                updateStockSelector();
                
                // 載入第一個股票
                currentStockIndex = 0;
                const firstStock = getStockAtIndex(0);
                if (firstStock) {
                    await loadStockChart(firstStock.code, firstStock.name);
                }
                
            } catch (error) {
                if (requestId !== viewLoadId) return;
                console.error('載入股票列表失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        載入失敗: ${error.message}
                    </div>
                `;
            }
        }
        
        // 根據當前排序取得股票
        function getStockAtIndex(index) {
            const list = isReverseOrder ? [...allStocksList].reverse() : allStocksList;
            if (index >= 0 && index < list.length) {
                return list[index];
            }
            return null;
        }
        
        // 更新下拉選單
        function updateStockSelector() {
            const selector = document.getElementById('stockSelector');
            
            // 確保完全清空現有選項
            while (selector.firstChild) {
                selector.removeChild(selector.firstChild);
            }
            
            const list = isReverseOrder ? [...allStocksList].reverse() : allStocksList;
            selector.disabled = list.length === 0;
            document.getElementById('prevStockBtn').disabled = list.length === 0;
            document.getElementById('nextStockBtn').disabled = list.length === 0;
            
            // 使用 DocumentFragment 提高效能並確保不重複
            const fragment = document.createDocumentFragment();
            
            list.forEach((stock, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                const candidate = currentCategory === 'breakout' ? breakoutCandidates.get(stock.code) : null;
                option.textContent = `${stock.code}_${stock.name}${candidate ? ` · ${Number(candidate.volume_multiple).toFixed(1)} 倍量` : ''}`;
                fragment.appendChild(option);
            });
            
            selector.appendChild(fragment);
            selector.value = currentStockIndex;
            
            console.log(`✅ 買賣超下拉選單已更新: ${list.length} 個選項`);
        }
        
        // 載入上一筆股票
        function loadPrevStock() {
            if (currentStockIndex > 0) {
                currentStockIndex--;
                const stock = getStockAtIndex(currentStockIndex);
                if (stock) {
                    if (currentMarket === 'WATCHLIST') {
                        loadWatchlistStockChart(stock.code, stock.name, stock.market);
                    } else {
                        loadStockChart(stock.code, stock.name);
                    }
                    document.getElementById('stockSelector').value = currentStockIndex;
                }
            }
        }
        
        // 載入下一筆股票
        function loadNextStock() {
            const maxIndex = allStocksList.length - 1;
            if (currentStockIndex < maxIndex) {
                currentStockIndex++;
                const stock = getStockAtIndex(currentStockIndex);
                if (stock) {
                    if (currentMarket === 'WATCHLIST') {
                        loadWatchlistStockChart(stock.code, stock.name, stock.market);
                    } else {
                        loadStockChart(stock.code, stock.name);
                    }
                    document.getElementById('stockSelector').value = currentStockIndex;
                }
            }
        }
        
        // 從下拉選單載入股票
        function loadStockFromSelector() {
            const selector = document.getElementById('stockSelector');
            const selectedIndex = parseInt(selector.value);
            if (!isNaN(selectedIndex)) {
                currentStockIndex = selectedIndex;
                const stock = getStockAtIndex(selectedIndex);
                if (stock) {
                    if (currentMarket === 'WATCHLIST') {
                        loadWatchlistStockChart(stock.code, stock.name, stock.market);
                    } else {
                        loadStockChart(stock.code, stock.name);
                    }
                }
            }
        }
        
        // 切換反向排序
        function toggleReverseOrder() {
            isReverseOrder = !isReverseOrder;
            
            if (currentMarket === 'WATCHLIST') {
                updateWatchlistSelector();
            } else {
                updateStockSelector();
            }
            
            // 直接跳到第一個股票
            currentStockIndex = 0;
            const firstStock = getStockAtIndex(0);
            if (firstStock) {
                if (currentMarket === 'WATCHLIST') {
                    loadWatchlistStockChart(firstStock.code, firstStock.name, firstStock.market);
                } else {
                    loadStockChart(firstStock.code, firstStock.name);
                }
                document.getElementById('stockSelector').value = 0;
            }
        }

        async function loadStockChart(stockCode, stockName) {
            showStockChartView();
            showBreakoutDetails(stockCode);
            const chartContent = document.getElementById('stockChartContent');
            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">生成圖表中...</div>';
            
            try {
                const query = `SELECT * FROM stock_data WHERE 股票代碼 = '${stockCode}' ORDER BY 日期`;
                const result = sqlDB.exec(query);
                
                if (result.length === 0 || result[0].values.length === 0) {
                    chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #e74c3c;">無該股票資料</div>';
                    return;
                }
                
                const columns = result[0].columns;
                const rows = result[0].values;
                const data = rows.map(row => {
                    const obj = {};
                    columns.forEach((col, idx) => {
                        obj[col] = row[idx];
                    });
                    return obj;
                }).filter(row => Number(String(row['收盤價']).replaceAll(',', '')) > 0);
                
                if (!data.length) throw new Error('沒有有效的收盤資料');

                // 先用全部資料計算MA
                const allCloses = data.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const allMA5 = calculateMA(allCloses, 5);
                const allMA10 = calculateMA(allCloses, 10);
                const allMA20 = calculateMA(allCloses, 20);
                const allMA60 = calculateMA(allCloses, 60);
                
                // 只取最後75筆來顯示
                const chartData = data.slice(-75);
                
                // 保存原始日期字符串用於判斷星期
                const rawDates = chartData.map(d => d['日期']);
                
                // 格式化日期為 MM/DD
                const dates = chartData.map(d => {
                    const date = new Date(String(d['日期']).replaceAll('.', '-') + 'T00:00:00');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${month}/${day}`;
                });
                const opens = chartData.map(d => parseFloat(String(d['開盤價']).replace(/,/g, '')) || 0);
                const highs = chartData.map(d => parseFloat(String(d['最高價']).replace(/,/g, '')) || 0);
                const lows = chartData.map(d => parseFloat(String(d['最低價']).replace(/,/g, '')) || 0);
                const closes = chartData.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const volumes = chartData.map(d => parseFloat(String(d['成交張數']).replace(/,/g, '')) || 0);
                
                // 取最後75筆對應的MA值
                const ma5 = allMA5.slice(-75);
                const ma10 = allMA10.slice(-75);
                const ma20 = allMA20.slice(-75);
                const ma60 = allMA60.slice(-75);
                
                const flow = (d, key) => d[key] == null ? null : (parseFloat(String(d[key]).replace(/,/g, '')) || 0);
                const foreign = chartData.map(d => flow(d, '外陸資買賣超張數'));
                const trust = chartData.map(d => flow(d, '投信買賣超張數'));
                const dealer = chartData.map(d => flow(d, '自營商買賣超張數'));
                
                const foreignCum = cumsum(foreign);
                const trustCum = cumsum(trust);
                const dealerCum = cumsum(dealer);
                
                generatePlotlyChart(chartContent, {
                    stockCode, stockName,
                    dates, rawDates, opens, highs, lows, closes, volumes,
                    ma5, ma10, ma20, ma60,
                    foreign, trust, dealer,
                    foreignCum, trustCum, dealerCum
                });
                
            } catch (error) {
                console.error('生成圖表失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        生成失敗: ${error.message}
                    </div>
                `;
            }
        }

        function calculateMA(data, period) {
            const result = [];
            for (let i = 0; i < data.length; i++) {
                if (i < period - 1) {
                    result.push(null);
                } else {
                    const sum = data.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
                    result.push(sum / period);
                }
            }
            return result;
        }

        function cumsum(arr) {
            let sum = 0;
            return arr.map(val => {
                if (val == null) return null;
                sum += val;
                return sum;
            });
        }

        async function loadWatchlistStocks() {
            const chartContent = document.getElementById('stockChartContent');
            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">載入追蹤股票...</div>';
            allStocksList = [];
            currentStockIndex = 0;
            updateWatchlistSelector();
            watchCandidates = new Map();
            const summary = document.getElementById('breakoutSummary');
            summary.style.display = 'block';
            const watch = manifest?.watchlist;
            summary.textContent = watch ? `五日爆量追蹤 ${watch.candidates} 檔（上市＋上櫃）。入選當日為第 1 天，保留最近 ${watch.watch_days} 個交易日；每天更新價格，未再爆量或跌回盤整區仍保留至第 5 天，第 6 天自動移出。上市資料 ${watch.market_dates.TSE}；上櫃資料 ${watch.market_dates.OTC}。` : '載入五日追蹤資料…';
            
            try {
                const requestId = ++viewLoadId;
                const hotDB = await getHotDatabase();
                if (requestId !== viewLoadId) return;
                if (sqlDB && sqlDB !== hotDB) sqlDB.close();
                sqlDB = hotDB;
                const candidateRows = hotDB.exec('SELECT * FROM watch_candidates')[0];
                watchCandidates = new Map((candidateRows?.values || []).map(values => {
                    const candidate = Object.fromEntries(candidateRows.columns.map((col, i) => [col, values[i]]));
                    return [`${candidate.market}:${candidate.code}`, candidate];
                }));

                // 讀取追蹤股票清單 (使用正確的中文欄位名稱)
                // 使用 DISTINCT 去重,避免歷史資料重複
                // 五日追蹤名單已由每日掃描建立
                const hotQuery = `
                    SELECT DISTINCT 股票代碼, 股票名稱, 類型
                    FROM hot_stocks 
                    ORDER BY 股票代碼
                `;
                const hotResult = hotDB.exec(hotQuery);
                // 不要關閉資料庫,後續還需要使用
                
                if (hotResult.length === 0 || hotResult[0].values.length === 0) {
                    chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #65758a;">最近 5 個交易日沒有爆量候選，追蹤名單目前為空。</div>';
                    return;
                }
                
                // 從資料庫讀取股票清單,類型欄位已經包含「上市」或「上櫃」資訊
                const watchlist = hotResult[0].values.map(([code, name, type]) => ({
                    code, 
                    name, 
                    market: type === '上市' ? 'TSE' : 'OTC'
                }));
                watchlist.sort((a, b) => {
                    const left = watchCandidates.get(`${a.market}:${a.code}`);
                    const right = watchCandidates.get(`${b.market}:${b.code}`);
                    return (right?.signal_date || '').localeCompare(left?.signal_date || '') ||
                        (right?.volume_multiple || 0) - (left?.volume_multiple || 0) || a.code.localeCompare(b.code);
                });
                
                // 追蹤股票模式：直接使用 stock_breakout_watch.db（已包含完整歷史資料）
                // 不需要再載入 stock_tse.db 和 stock_otc.db,因為:
                // 1. stock_breakout_watch.db 已包含所有追蹤股票的完整交易歷史
                // 2. stock_tse.db 和 stock_otc.db 檔案可能不存在
                
                // 儲存股票清單和數據庫引用
                allStocksList = watchlist;
                sqlDB = hotDB;  // 直接使用 stock_breakout_watch.db
                
                // 填充下拉選單
                updateWatchlistSelector();
                
                // 載入第一個股票
                currentStockIndex = 0;
                const firstStock = getStockAtIndex(0);
                if (firstStock) {
                    await loadWatchlistStockChart(firstStock.code, firstStock.name, firstStock.market);
                }
                
            } catch (error) {
                console.error('載入追蹤股票失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        載入失敗: ${error.message}
                    </div>
                `;
            }
        }
        
        function updateWatchlistSelector() {
            const selector = document.getElementById('stockSelector');
            selector.disabled = allStocksList.length === 0;
            document.getElementById('prevStockBtn').disabled = allStocksList.length === 0;
            document.getElementById('nextStockBtn').disabled = allStocksList.length === 0;
            
            // 確保完全清空現有選項
            while (selector.firstChild) {
                selector.removeChild(selector.firstChild);
            }
            
            const list = isReverseOrder ? [...allStocksList].reverse() : allStocksList;
            
            // 使用 DocumentFragment 提高效能並確保不重複
            const fragment = document.createDocumentFragment();
            
            list.forEach((stock, idx) => {
                const option = document.createElement('option');
                option.value = idx;
                const candidate = watchCandidates.get(`${stock.market}:${stock.code}`);
                option.textContent = `${stock.code}_${stock.name} (${stock.market === 'TSE' ? '上市' : '上櫃'}) · 第 ${candidate.signal_age} 天 / ${candidate.status}`;
                fragment.appendChild(option);
            });
            
            selector.appendChild(fragment);
            selector.value = currentStockIndex;
            
            console.log(`✅ 追蹤股下拉選單已更新: ${list.length} 個選項`);
        }
        
        async function loadWatchlistStockChart(stockCode, stockName, market) {
            showStockChartView();
            showBreakoutDetails(stockCode);
            const chartContent = document.getElementById('stockChartContent');
            chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #95a5a6;">生成圖表中...</div>';
            
            
            try {
                // 追蹤股票模式：直接從 stock_breakout_watch.db 的 hot_stocks 表讀取
                const query = `SELECT * FROM hot_stocks WHERE 股票代碼 = '${stockCode}' AND 類型 = '${market === 'TSE' ? '上市' : '上櫃'}' ORDER BY 日期`;
                const result = sqlDB.exec(query);
                
                if (result.length === 0 || result[0].values.length === 0) {
                    chartContent.innerHTML = '<div style="text-align: center; padding: 40px; color: #e74c3c;">無該股票資料</div>';
                    return;
                }
                
                const columns = result[0].columns;
                const rows = result[0].values;
                const data = rows.map(row => {
                    const obj = {};
                    columns.forEach((col, idx) => {
                        obj[col] = row[idx];
                    });
                    return obj;
                }).filter(row => Number(String(row['收盤價']).replaceAll(',', '')) > 0);
                
                if (!data.length) throw new Error('沒有有效的收盤資料');

                // 先用全部資料計算MA
                const allCloses = data.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const allMA5 = calculateMA(allCloses, 5);
                const allMA10 = calculateMA(allCloses, 10);
                const allMA20 = calculateMA(allCloses, 20);
                const allMA60 = calculateMA(allCloses, 60);
                
                // 只取最後75筆來顯示
                const chartData = data.slice(-75);
                
                // 保存原始日期字符串用於判斷星期
                const rawDates = chartData.map(d => d['日期']);
                
                // 格式化日期為 MM/DD
                const dates = chartData.map(d => {
                    const date = new Date(String(d['日期']).replaceAll('.', '-') + 'T00:00:00');
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    return `${month}/${day}`;
                });
                const opens = chartData.map(d => parseFloat(String(d['開盤價']).replace(/,/g, '')) || 0);
                const highs = chartData.map(d => parseFloat(String(d['最高價']).replace(/,/g, '')) || 0);
                const lows = chartData.map(d => parseFloat(String(d['最低價']).replace(/,/g, '')) || 0);
                const closes = chartData.map(d => parseFloat(String(d['收盤價']).replace(/,/g, '')) || 0);
                const volumes = chartData.map(d => parseFloat(String(d['成交量']).replace(/,/g, '')) || 0);
                
                // 取最後75筆對應的MA值
                const ma5 = allMA5.slice(-75);
                const ma10 = allMA10.slice(-75);
                const ma20 = allMA20.slice(-75);
                const ma60 = allMA60.slice(-75);
                
                const flow = (d, key) => d[key] == null ? null : (parseFloat(String(d[key]).replace(/,/g, '')) || 0);
                const foreign = chartData.map(d => flow(d, '外陸資買賣超張數'));
                const trust = chartData.map(d => flow(d, '投信買賣超張數'));
                const dealer = chartData.map(d => flow(d, '自營商買賣超張數'));
                
                const foreignCum = cumsum(foreign);
                const trustCum = cumsum(trust);
                const dealerCum = cumsum(dealer);
                
                generatePlotlyChart(chartContent, {
                    stockCode, stockName,
                    dates, rawDates, opens, highs, lows, closes, volumes,
                    ma5, ma10, ma20, ma60,
                    foreign, trust, dealer,
                    foreignCum, trustCum, dealerCum
                });
                

                
            } catch (error) {
                console.error('生成圖表失敗:', error);
                chartContent.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #e74c3c;">
                        生成失敗: ${error.message}
                    </div>
                `;
            }
        }

        function getChartViewportLayout(title) {
            const mobile = window.matchMedia('(max-width: 767px)').matches;
            const tickStep = mobile ? Math.max(1, Math.ceil(currentChartTicks.values.length / 6)) : 1;
            const tickIndexes = currentChartTicks.values.map((_, index) => index)
                .filter(index => index % tickStep === 0 || index === currentChartTicks.values.length - 1);
            return {
                title: {
                    text: mobile ? title.replace(' 技術分析圖表', '<br>技術分析圖表') : title,
                    y: 0.98,
                    x: 0.5,
                    xanchor: 'center',
                    font: { size: mobile ? 14 : 17 }
                },
                height: mobile ? 1000 : 800,
                margin: mobile ? { t: 90, b: 130, l: 50, r: 12 } : { t: 80, b: 10, l: 60, r: 20 },
                xaxis: {
                    domain: [0, 1],
                    rangeslider: { visible: false },
                    type: 'category',
                    tickangle: -45,
                    tickmode: 'array',
                    tickvals: tickIndexes.map(index => currentChartTicks.values[index]),
                    ticktext: tickIndexes.map(index => currentChartTicks.text[index]),
                    fixedrange: true
                },
                legend: {
                    orientation: 'h',
                    yanchor: mobile ? 'top' : 'bottom',
                    y: mobile ? -0.08 : 0.26,
                    xanchor: 'center',
                    x: 0.5,
                    font: { size: mobile ? 10 : 12 }
                },
                font: { family: 'Microsoft JhengHei, Arial, sans-serif', size: mobile ? 11 : 12 }
            };
        }

        function generatePlotlyChart(container, data) {
            const {
                stockCode, stockName,
                dates, rawDates, opens, highs, lows, closes, volumes,
                ma5, ma10, ma20, ma60,
                foreign, trust, dealer,
                foreignCum, trustCum, dealerCum
            } = data;
            
            container.innerHTML = '<div id="plotlyChart"></div>';
            currentChartTitle = `${stockCode} ${stockName} 技術分析圖表 (最近75筆)`;
            
            // 計算只顯示週一和最新日期的 tick 設定
            const tickvals = [];
            const ticktext = [];
            
            for (let i = 0; i < dates.length; i++) {
                const fullDate = new Date(String(rawDates[i]).replaceAll('.', '-') + 'T00:00:00');
                const dayOfWeek = fullDate.getDay(); // 0=Sunday, 1=Monday, ...
                
                // 如果是週一（1）或最後一天
                if (dayOfWeek === 1 || i === dates.length - 1) {
                    tickvals.push(dates[i]);
                    ticktext.push(dates[i]);
                }
            }
            currentChartTicks = { values: tickvals, text: ticktext };
            
            const candlestick = {
                x: dates,
                open: opens,
                high: highs,
                low: lows,
                close: closes,
                type: 'candlestick',
                name: 'K線',
                increasing: {line: {color: '#FF5252'}, fillcolor: '#FF5252'},
                decreasing: {line: {color: '#00C851'}, fillcolor: '#00C851'},
                xaxis: 'x',
                yaxis: 'y',
                hovertemplate: '%{x}<br>open: %{open}<br>high: %{high}<br>low: %{low}<br>close: %{close}<extra></extra>',
                showlegend: false
            };
            
            const ma5Trace = {
                x: dates,
                y: ma5,
                type: 'scatter',
                mode: 'lines',
                name: 'MA5',
                line: {color: 'blue', width: 1.5},
                xaxis: 'x',
                yaxis: 'y'
            };
            
            const ma10Trace = {
                x: dates,
                y: ma10,
                type: 'scatter',
                mode: 'lines',
                name: 'MA10',
                line: {color: 'orange', width: 1.5},
                xaxis: 'x',
                yaxis: 'y'
            };
            
            const ma20Trace = {
                x: dates,
                y: ma20,
                type: 'scatter',
                mode: 'lines',
                name: 'MA20',
                line: {color: '#9C27B0', width: 1.5},
                xaxis: 'x',
                yaxis: 'y'
            };
            
            const ma60Trace = {
                x: dates,
                y: ma60,
                type: 'scatter',
                mode: 'lines',
                name: 'MA60',
                line: {color: '#D32F2F', width: 1.5},
                xaxis: 'x',
                yaxis: 'y'
            };
            
            const volumeColors = volumes.map((v, i) => {
                if (i === 0) return closes[i] >= opens[i] ? 'rgba(255, 82, 82, 0.8)' : 'rgba(0, 200, 81, 0.8)';
                return closes[i] >= closes[i-1] ? 'rgba(255, 82, 82, 0.8)' : 'rgba(0, 200, 81, 0.8)';
            });
            
            const volumeTrace = {
                x: dates,
                y: volumes,
                type: 'bar',
                name: '成交量',
                marker: {color: volumeColors},
                xaxis: 'x',
                yaxis: 'y2',
                showlegend: false
            };
            
            const foreignTrace = {
                x: dates,
                y: foreign,
                type: 'bar',
                name: '外資',
                marker: {color: 'rgba(255, 82, 82, 0.75)'},
                xaxis: 'x',
                yaxis: 'y3',
                legendgroup: 'foreign'
            };
            
            const trustTrace = {
                x: dates,
                y: trust,
                type: 'bar',
                name: '投信',
                marker: {color: 'rgba(0, 200, 81, 0.75)'},
                xaxis: 'x',
                yaxis: 'y3',
                legendgroup: 'trust'
            };
            
            const dealerTrace = {
                x: dates,
                y: dealer,
                type: 'bar',
                name: '自營商',
                marker: {color: 'rgba(0, 191, 255, 0.75)'},
                xaxis: 'x',
                yaxis: 'y3',
                legendgroup: 'dealer'
            };
            
            const foreignCumTrace = {
                x: dates,
                y: foreignCum,
                type: 'scatter',
                mode: 'lines',
                name: '外資累積',
                line: {color: 'rgb(255, 82, 82)', width: 2.5, shape: 'spline', smoothing: 0.8},
                xaxis: 'x',
                yaxis: 'y4',
                legendgroup: 'foreign'
            };
            
            const trustCumTrace = {
                x: dates,
                y: trustCum,
                type: 'scatter',
                mode: 'lines',
                name: '投信累積',
                line: {color: 'rgb(0, 200, 81)', width: 2.5, shape: 'spline', smoothing: 0.8},
                xaxis: 'x',
                yaxis: 'y4',
                legendgroup: 'trust'
            };
            
            const dealerCumTrace = {
                x: dates,
                y: dealerCum,
                type: 'scatter',
                mode: 'lines',
                name: '自營商累積',
                line: {color: 'rgb(0, 191, 255)', width: 2.5, shape: 'spline', smoothing: 0.8},
                xaxis: 'x',
                yaxis: 'y4',
                legendgroup: 'dealer'
            };
            
            const plotData = [
                candlestick, ma5Trace, ma10Trace, ma20Trace, ma60Trace,
                volumeTrace,
                foreignTrace, trustTrace, dealerTrace,
                foreignCumTrace, trustCumTrace, dealerCumTrace
            ];
            
            const layout = {
                yaxis: {
                    domain: [0.71, 1],
                    title: '股價 (元)',
                    fixedrange: true
                },
                yaxis2: {
                    domain: [0.53, 0.71],
                    title: '成交量 (張)',
                    fixedrange: true
                },
                yaxis3: {
                    domain: [0.28, 0.505],
                    title: '當日買賣超 (張)',
                    fixedrange: true
                },
                yaxis4: {
                    domain: [0.03, 0.255],
                    title: '累積買賣超 (張)',
                    fixedrange: true
                },
                showlegend: true,
                hovermode: 'x unified',
                template: 'plotly_white',
                barmode: 'relative',
                dragmode: false,
                ...getChartViewportLayout(currentChartTitle)
            };
            
            const config = {
                responsive: true,
                displayModeBar: false,
                displaylogo: false,
                scrollZoom: false,
                doubleClick: false
            };
            
            Plotly.newPlot('plotlyChart', plotData, layout, config);
        }

        async function autoLoadData() {
            try {
                const response = await fetch(DATA_PATH + 'manifest.json', {cache: 'no-cache'});
                if (!response.ok) throw new Error('無法讀取資料日期');
                manifest = await response.json();
                updateDataDate();
                switchMarket(currentMarket);
            } catch (error) {
                document.getElementById('updateTime').textContent = error.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            console.log('📱 台股機構投資人買賣分析系統');
            // 買賣超90天導航按鈕
            const prevStockBtn = document.getElementById('prevStockBtn');
            if (prevStockBtn) {
                prevStockBtn.addEventListener('click', loadPrevStock);
            }
            
            const nextStockBtn = document.getElementById('nextStockBtn');
            if (nextStockBtn) {
                nextStockBtn.addEventListener('click', loadNextStock);
            }
            
            const stockSelector = document.getElementById('stockSelector');
            if (stockSelector) {
                stockSelector.addEventListener('change', loadStockFromSelector);
            }
            
            const reverseOrderCheckbox = document.getElementById('reverseOrderCheckbox');
            if (reverseOrderCheckbox) {
                reverseOrderCheckbox.addEventListener('change', toggleReverseOrder);
            }
            
            let resizeFrame = null;
            window.addEventListener('resize', () => {
                cancelAnimationFrame(resizeFrame);
                resizeFrame = requestAnimationFrame(() => {
                    resizeExternalFrame();
                    const chart = document.getElementById('plotlyChart');
                    if (chart?.data && document.getElementById('stockChartContainer').style.display !== 'none') {
                        Plotly.relayout(chart, getChartViewportLayout(currentChartTitle));
                    }
                });
            });
            
            autoLoadData();
        });
    </script>
