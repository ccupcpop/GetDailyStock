name: 台股完整分析與網站發布

on:
  schedule:
    # 台灣時間 18:00；啟動時間可能延遲，後續步驟依執行結果串接。
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'index.html'
      - 'requirements.txt'
      - 'tests/**'
      - 'StockInfo/*company_list.csv'
      - 'StockInfo/*concept_stocks.csv'
      - '.github/workflows/daily_stock_analysis.yml'

permissions:
  contents: read

concurrency:
  group: daily-stock-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TZ: Asia/Taipei
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test integration
        run: python -m unittest discover -s tests -v
      - name: Fetch daily data, analyze trends and build website
        run: python run_pipeline.py
      - name: Save data for the next run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add StockTSEDaily/*.csv StockTSEShares/*.csv StockOTCDaily/*.csv StockOTCShares/*.csv
          git add StockInfo/*.db StockInfo/*_analysis_result.xlsx StockInfo/*_analysis_result_complete.html StockInfo/*_buy_ranking.txt
          git add StockTSEHistory/stock_tse.db StockOTCHistory/stock_otc.db
          if ! git diff --cached --quiet; then
            git commit -m "Update daily stock analysis $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
      - name: Save downloadable analysis
        uses: actions/upload-artifact@v4
        with:
          name: stock-analysis-${{ github.run_number }}
          path: |
            _site/StockInfo/*.xlsx
            _site/StockInfo/*.db
            _site/trends/
          retention-days: 30
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish completed analysis
        id: deployment
        uses: actions/deploy-pages@v4
